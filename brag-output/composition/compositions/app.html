      tl.fromTo(row + " .sw .n", { opacity: 0, y: 10, filter: "blur(6px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.25, ease: "expo.out" }, t + 0.06);

    const click = (sel, t) => tl.fromTo(sel, { scale: 1 }, { scale: 0.94, duration: 0.07, yoyo: true, repeat: 1, ease: "power2.inOut" }, t);

    // window and rows arrive

    click("#app-fetch", 4.7);

    tl.to("#app-cursor", { opacity: 0, duration: 0.2 }, 5.2);

      status("#app-s" + (4 + i), 4.75 + i * 0.5);

    status("#app-s10", 7.7);
    tl.set("#app-spin", { opacity: 0 }, 7.7);
